{% if confirm %}
<div class="panel" style="border-color: #f3cfcb">
  <div class="panel-header" style="background: #fdf3f2; border-radius: var(--radius) var(--radius) 0 0"><h2 class="text-danger"><i class="fas fa-exclamation-triangle mr-2"></i>Confirm delete</h2></div>
  <form method="POST">
    {% csrf_token %}
    <div class="panel-body">
      <p>You are about to delete <strong>{{ count }} {{ what }}</strong> for <strong>{{ label }}</strong>.
         Your name, the time and your reason will be recorded. Deleted records can be restored from the Recycle Bin.</p>
      {% include "src/_selection.html" %}
      <input type="hidden" name="{{ form_name }}" value="1">
      <div class="form-row" style="max-width: 760px">
        <div class="form-group col-md-7"><label>Reason for deleting</label><input class="form-control" name="reason" required maxlength="300"></div>
        <div class="form-group col-md-5"><label>Type <strong>{{ sel.class.name }}</strong> to confirm</label><input class="form-control" name="confirm_class" required autocomplete="off"></div>
      </div>
    </div>
    <div class="panel-footer">
      <button name="confirm_delete" value="1" class="btn btn-danger"><i class="fas fa-trash-alt"></i>Delete {{ count }} {{ what }}</button>
      <a href="" class="btn btn-light">Cancel</a>
    </div>
  </form>
</div>
{% endif %}

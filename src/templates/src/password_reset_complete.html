{% extends "src/index.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="panel mx-auto" style="max-width: 520px; margin-top: 24px">
  <div class="panel-body text-center py-5">
    <div class="stat mx-auto mb-3" style="width: 64px; height: 64px; padding: 0; justify-content: center; border: 0; box-shadow: none"><div class="icon " style="width: 64px; height: 64px; font-size: 24px"><i class="fas fa-check"></i></div></div>
    <h1 class="h4">Password changed</h1>
    <p class="muted">Your new password is set.</p><a href="{% url 'home' %}" class="btn btn-primary mt-2">Sign in</a>
  </div>
</div>
{% endblock %}
